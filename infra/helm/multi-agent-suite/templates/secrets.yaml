{{- if not .Values.secrets.useAzureKeyVault }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-calling-secrets
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
type: Opaque
data:
  TWILIO_ACCOUNT_SID: {{ "AC_dummy_local_sid" | b64enc | quote }}
  TWILIO_AUTH_TOKEN: {{ "dummy_local_auth_token" | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-mail-secrets
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
type: Opaque
data:
  ZOHO_CLIENT_ID: {{ "dummy_zoho_client_id" | b64enc | quote }}
  ZOHO_CLIENT_SECRET: {{ "dummy_zoho_client_secret" | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-marketing-secrets
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
type: Opaque
data:
  META_APP_ID: {{ "dummy_meta_app_id" | b64enc | quote }}
  META_APP_SECRET: {{ "dummy_meta_app_secret" | b64enc | quote }}
  META_ACCESS_TOKEN: {{ "dummy_meta_access_token" | b64enc | quote }}
{{- end }}
