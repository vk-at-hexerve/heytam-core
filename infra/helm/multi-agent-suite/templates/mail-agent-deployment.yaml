{{- if .Values.agents.mail.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-agent
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: mail-agent
spec:
  replicas: {{ .Values.agents.mail.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-agent-suite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mail-agent
  template:
    metadata:
      labels:
        {{- include "multi-agent-suite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mail-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.agents.mail.port }}"
        prometheus.io/path: "/metrics"
      {{- if .Values.secrets.useAzureKeyVault }}
      annotations:
        secrets-store-csi-driver.sigs.k8s.io/used: "true"
      {{- end }}
    spec:
      containers:
        - name: mail-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/agents/mail-agent.js"]
          ports:
            - name: http
              containerPort: {{ .Values.agents.mail.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "multi-agent-suite.fullname" . }}-config
            - secretRef:
                name: {{ include "multi-agent-suite.fullname" . }}-mail-secrets
          resources:
            {{- toYaml .Values.agents.mail.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .Values.secrets.useAzureKeyVault }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.secrets.useAzureKeyVault }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "multi-agent-suite.fullname" . }}-kv
      {{- end }}
{{- end }}
