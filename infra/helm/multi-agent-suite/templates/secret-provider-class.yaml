{{- if .Values.secrets.useAzureKeyVault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-kv
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true" # Assume workload identity or VM MSI
    userAssignedIdentityID: "" 
    keyvaultName: {{ .Values.secrets.keyVaultName | quote }}
    objects: |
      array:
        - |
          objectName: TWILIO-ACCOUNT-SID
          objectType: secret
        - |
          objectName: TWILIO-AUTH-TOKEN
          objectType: secret
        - |
          objectName: ZOHO-CLIENT-ID
          objectType: secret
        - |
          objectName: ZOHO-CLIENT-SECRET
          objectType: secret
        - |
          objectName: META-APP-ID
          objectType: secret
        - |
          objectName: META-APP-SECRET
          objectType: secret
        - |
          objectName: META-ACCESS-TOKEN
          objectType: secret
    tenantId: {{ .Values.secrets.tenantId | quote }}
  secretObjects:
    - secretName: {{ include "multi-agent-suite.fullname" . }}-secrets
      type: Opaque
      data:
        - key: TWILIO_ACCOUNT_SID
          objectName: TWILIO-ACCOUNT-SID
        - key: TWILIO_AUTH_TOKEN
          objectName: TWILIO-AUTH-TOKEN
        - key: ZOHO_CLIENT_ID
          objectName: ZOHO-CLIENT-ID
        - key: ZOHO_CLIENT_SECRET
          objectName: ZOHO-CLIENT-SECRET
        - key: META_APP_ID
          objectName: META-APP-ID
        - key: META_APP_SECRET
          objectName: META-APP-SECRET
        - key: META_ACCESS_TOKEN
          objectName: META-ACCESS-TOKEN
{{- end }}
