{{- range $agentName, $agentConfig := .Values.agents }}
{{- if $agentConfig.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $agentName }}
  labels:
    {{- include "multi-agent-suite.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $agentName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $agentName }}
  minReplicas: {{ $agentConfig.autoscaling.minReplicas }}
  maxReplicas: {{ $agentConfig.autoscaling.maxReplicas }}
  metrics:
    {{- if $agentConfig.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $agentConfig.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
---
{{- end }}
{{- end }}
