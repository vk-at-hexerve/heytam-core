{{- if .Values.localRedis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-redis
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "multi-agent-suite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "multi-agent-suite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-redis
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    {{- include "multi-agent-suite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
