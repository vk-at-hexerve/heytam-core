{{- if .Values.localPostgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-postgres
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "multi-agent-suite.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "multi-agent-suite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "multi-agent-suite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: heytam
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-postgres
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "multi-agent-suite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
