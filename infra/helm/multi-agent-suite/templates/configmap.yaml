apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-agent-suite.fullname" . }}-config
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  CLIENT_ID: {{ .Values.global.clientId | quote }}
  {{- if .Values.localPostgres.enabled }}
  DATABASE_URL: "postgresql://postgres:password@{{ include "multi-agent-suite.fullname" . }}-postgres:5432/heytam"
  {{- end }}
  {{- if .Values.localRedis.enabled }}
  REDIS_URL: "redis://{{ include "multi-agent-suite.fullname" . }}-redis:6379"
  {{- end }}
