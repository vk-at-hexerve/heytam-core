{{- if .Values.agents.heytam.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heytam
  labels:
    {{- include "multi-agent-suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: heytam
spec:
  replicas: {{ .Values.agents.heytam.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-agent-suite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: heytam
  template:
    metadata:
      labels:
        {{- include "multi-agent-suite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: heytam
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.agents.heytam.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: heytam
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/agents/heytam.js"]
          ports:
            - name: http
              containerPort: {{ .Values.agents.heytam.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "multi-agent-suite.fullname" . }}-config
          resources:
            {{- toYaml .Values.agents.heytam.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
